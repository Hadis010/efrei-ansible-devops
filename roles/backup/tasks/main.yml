---
- name: Create backup directory
  ansible.builtin.file:
    path: "{{ backup_dir }}"
    state: directory
    owner: root
    mode: '0750'

- name: Deploy backup script
  ansible.builtin.copy:
    dest: /usr/local/bin/todos-backup.sh
    mode: '0750'
    owner: root
    content: |
      #!/bin/bash
      # Script de backup automatique - généré par Ansible
      DATE=$(date +%Y%m%d_%H%M%S)
      BACKUP_DIR="{{ backup_dir }}"

      # Backup base de données
      mysqldump -u {{ backup_db_user }} -p{{ backup_db_password }} \
        {{ backup_db_name }} > "${BACKUP_DIR}/db_${DATE}.sql"

      # Backup fichiers application
      tar -czf "${BACKUP_DIR}/app_${DATE}.tar.gz" {{ backup_app_dir }}

      # Rotation : garder seulement les {{ backup_keep }} derniers backups
      ls -t ${BACKUP_DIR}/db_*.sql | tail -n +{{ backup_keep + 1 }} | xargs -r rm
      ls -t ${BACKUP_DIR}/app_*.tar.gz | tail -n +{{ backup_keep + 1 }} | xargs -r rm

      echo "Backup completed: ${DATE}"

- name: Schedule backup via cron
  ansible.builtin.cron:
    name: "todos-backup"
    hour: "{{ backup_hour }}"
    minute: "{{ backup_minute }}"
    job: "/usr/local/bin/todos-backup.sh >> /var/log/todos-backup.log 2>&1"
    state: present

- name: Run initial backup
  ansible.builtin.command:
    cmd: /usr/local/bin/todos-backup.sh
  changed_when: true
