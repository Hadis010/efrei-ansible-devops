---
- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    mode: '0755'

- name: Copy application files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ app_dir }}/{{ item }}"
    owner: "{{ app_user }}"
    mode: '0644'
  loop:
    - app.js
    - package.json

- name: Install Node.js dependencies
  community.general.npm:
    path: "{{ app_dir }}"
    state: present

- name: Deploy systemd service for the app
  ansible.builtin.template:
    src: todos-api.service.j2
    dest: /etc/systemd/system/todos-api.service
    mode: '0644'
  notify: restart todos-api

- name: Enable and start todos-api service
  ansible.builtin.systemd:
    name: todos-api
    state: started
    enabled: true
    daemon_reload: true
